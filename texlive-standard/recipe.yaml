build:
  number: 0
  script: build.sh

requirements:
  build:
    - python
  host:
    - texlive-core ==${{ texlive_version }}
  run:
    - texlive-core ==${{ texlive_version }}
    - biber
    - chktex
  run_constraints:
    - texlive-basic <0a0
    - texlive-science <0a0

tests:
  - script:
      - export LANG=C
      - export LC_ALL=C
      - lualatex --version
      - pdflatex --version
      - tlmgr info --only-installed scheme-basic
      - tlmgr info --only-installed scheme-small
      - echo "\\documentclass{article}\\begin{document}LuaLaTeX works.\\end{document}" > smoke.tex
      - lualatex -interaction=nonstopmode -halt-on-error smoke.tex
      - test -s smoke.pdf
      - echo "\\documentclass{article}\\usepackage{times}\\begin{document}Times and \\texttt{Courier}.\\end{document}" > fonts.tex
      - pdflatex -interaction=nonstopmode -halt-on-error fonts.tex
      - test -s fonts.pdf
      - xelatex --version
      - echo "\\documentclass{article}\\usepackage{booktabs,microtype,xcolor}\\begin{document}Standard profile.\\end{document}" > standard.tex
      - latexmk -pdf -interaction=nonstopmode -halt-on-error standard.tex
      - test -s standard.pdf
      - echo "\\documentclass{article}\\begin{document}XeLaTeX works.\\end{document}" > xetex.tex
      - xelatex -interaction=nonstopmode -halt-on-error xetex.tex
      - test -s xetex.pdf
      - echo "@book{lamport,author={Leslie Lamport},title={LaTeX},year={1994},publisher={Addison-Wesley}}" > refs.bib
      - echo "\\documentclass{article}\\usepackage[backend=biber]{biblatex}\\addbibresource{refs.bib}\\begin{document}\\cite{lamport}\\printbibliography\\end{document}" > bibliography.tex
      - latexmk -pdf -interaction=nonstopmode -halt-on-error bibliography.tex
      - test -s bibliography.pdf

about:
  homepage: https://www.tug.org/texlive/
  license: GPL-2.0-or-later AND LPPL-1.3c AND OFL-1.1
  summary: TeX Live standard authoring distribution
  description: |
    A locked build of TeX Live's scheme-small, with commonly expected LaTeX
    packages, recommended fonts, graphics and bibliography support, and latexmk.
    It is intended as the default interactive and CI authoring environment.

extra:
  recipe-maintainers:
    - wolfv
  texlive-profile: standard
  texlive-root-packages: scheme-small collection-fontsrecommended
