[workspace]
name = "texlive-forge"
version = "0.1.0"
description = "Rattler-build recipes for TeX Live and a Qt-based editor"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rattler-build = ">=0.71,<0.72"
python = ">=3.11"

[tasks]
render = "rattler-build build --render-only --with-solve --recipe-dir ."
generate-basic = "python scripts/generate_texlive_scheme.py --profile basic"
generate-standard = "python scripts/generate_texlive_scheme.py --profile standard"
generate-science = "python scripts/generate_texlive_scheme.py --profile science"
build-core = "rattler-build build --recipe texlive-core --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-basic = "rattler-build build --recipe texlive-basic --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-biber = "rattler-build build --recipe biber --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-standard = "rattler-build build --recipe texlive-standard --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-science = "rattler-build build --recipe texlive-science --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-texlive = "rattler-build build --recipe texlive --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
build-texmaker = "rattler-build build --recipe texmaker --skip-existing all --channel https://prefix.dev/wolfv/texlive --channel conda-forge"
