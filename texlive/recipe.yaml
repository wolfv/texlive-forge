schema_version: 1

context:
  version: "20260301"

package:
  name: texlive
  version: ${{ version }}

build:
  number: 2
  noarch: generic

requirements:
  run:
    - texlive-standard
  extras:
    editor:
      - texmaker
    conversion:
      - pandoc
      - ghostscript
    desktop:
      - texmaker
      - pandoc
      - ghostscript

tests:
  - script:
      - pdflatex --version
      - bibtex --version

about:
  homepage: https://www.tug.org/texlive/
  license: GPL-2.0-or-later AND LPPL-1.3c
  summary: Standard TeX Live authoring distribution
  description: |
    Convenience package that installs texlive-standard, including commonly
    expected LaTeX packages, fonts, latexmk, and working PDFLaTeX and LuaLaTeX.
    V3 extras optionally add Texmaker and document-conversion tools.

extra:
  recipe-maintainers:
    - wolfv
