schema_version: 1

context:
  version: "20260301"

package:
  name: texlive
  version: ${{ version }}

build:
  number: 3
  noarch: generic

requirements:
  run:
    - texlive-core ==${{ version }}
  extras:
    basic:
      - texlive-basic
    standard:
      - texlive-standard
    science:
      - texlive-science
    conversion:
      - pandoc
      - ghostscript
    standard-desktop:
      - texlive-standard
      - texmaker >=6.0.1
      - pandoc
      - ghostscript
    science-desktop:
      - texlive-science
      - texmaker >=6.0.1
      - pandoc
      - ghostscript

tests:
  - script:
      - tex --version
      - kpsewhich --version

about:
  homepage: https://www.tug.org/texlive/
  license: GPL-2.0-or-later AND LPPL-1.3c
  summary: Selectable TeX Live distribution profiles
  description: |
    V3 metapackage for selecting the basic, standard, or science TeX Live
    profile through extras. Desktop extras add Texmaker, Pandoc, and
    Ghostscript. Without an extra it installs only the compiled TeX Live core.

extra:
  recipe-maintainers:
    - wolfv
