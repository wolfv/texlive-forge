name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            build_core: true
            build_meta: true
            build_editor: true
          - runner: macos-13
            build_core: true
            build_meta: false
            build_editor: true
          - runner: macos-14
            build_core: true
            build_meta: false
            build_editor: true
          - runner: windows-latest
            build_core: false
            build_meta: false
            build_editor: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: latest
          cache: true

      - name: Build texlive-core
        if: matrix.build_core
        run: pixi run build-core

      - name: Build the basic TeX scheme
        if: matrix.build_core
        run: pixi run build-basic

      - name: Build texlive convenience package
        if: matrix.build_meta
        run: pixi run build-texlive

      - name: Build Texmaker
        if: matrix.build_editor
        run: pixi run build-texmaker

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conda-packages-${{ matrix.runner }}
          path: output/**/*.conda
          if-no-files-found: ignore
