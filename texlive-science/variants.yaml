# A small conda-forge-compatible compiler matrix for standalone rattler-build.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx and x86_64
    then: "10.13"
  - if: osx and arm64
    then: "11.0"
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
c_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
cxx_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
zip_keys:
  - [c_compiler_version, cxx_compiler_version]
